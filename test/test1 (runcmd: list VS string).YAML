users:
  - name: flatcar-admin
    groups: sudo, docker
    ssh-authorized-keys:
      - ssh-rsa AAAAB3NzaC1yc2EAAAADAQABAAABgQC...

write_files:
  - path: /etc/kubernetes/bootstrap.conf
    content: |
      server: https://192.168.1.10:6443
    permissions: "0644"

runcmd:
  # string eg.
  - "echo 'Starting Kubernetes Node Bootstrap...'"
  
  # list eg.
  - ["systemctl", "daemon-reload"]
  
  - ["kubeadm", "join", "--token", "abcdef.0123456789", "192.168.1.10:6443"]
  
  - "touch /var/log/bootstrap-complete.log"